- name: Abeba Birhane
  active: true
  image: /abb.jpg
  pronouns: she/her
  role: Assistant Professor, Founder & Principal Investigator of AIAL
  bio: Dr Abeba Birhane founded and leads the AI Accountability Lab (AIAL) at Trinity College Dublin. She received her PhD in 2022 from University College Dublin and is currently a Research Fellow at the School of Computer Science and Statistics in Trinity College Dublin.
  achievements: Dr Birhane researches AI accountability, with a particular focus on audits of AI models and training datasets – work for which she was featured on the TIME100 Most Influential People in AI list in 2023. Dr. Birhane also served on the United Nations Secretary-General’s AI Advisory Body and the AI Advisory Council in Ireland.
