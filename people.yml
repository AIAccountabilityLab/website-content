- name: Pranav A
  image: /people/riccardoangius.jpg
  pronouns: he/they
  role: Visiting Researcher
  long: |
    Pranav is a PhD student at University of Hamburg. His research focus is on AI accountability and critical AI. His doctoral work explores sociotechnical interactions via case studies like publishing policies, surveillance, benchmarking and many more. At AIAL, his visiting project involves conducting sociotechnical audits, particularly focusing on impact of current age assurance methods, practices, and policies. His research has been published in many top-tier conferences, including receiving Distinguished Paper Awards at FAccT. He is a weird mix of NLP, computer vision, HCI and policy design. He is a co-founder of Queer in AI and established inclusive policies in many academic conferences. Outside of academia, he is an improv comedian and a mindfulness teacher.
