- name: Maribeth Rauh
  active: true
  image: /mrauh.jpg
  pronouns: she/her
  role: Researcher
  bio: Maribeth Rauh researches sociotechnical evaluation of AI systems, with particular attention to how they exacerbate structural inequality. Her current work focuses on justice-oriented audit frameworks and evaluations of AI "agents."
  achievements: Prior to joining the AIAL, she worked as a Research Engineer at DeepMind, collaborating across engineering, research, and ethics teams on questions at the intersection of AI development and societal impact. Her research has been published at top conferences including NeurIPS, ICLR, ACM Conference on Fairness, Accountability, and Transparency (FAccT), and AAAI/ACM Conference on AI, Ethics, and Society (AIES).
