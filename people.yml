- name: Hellina Hailu Nigatu
  image: /people/HJP.jpg
  pronouns: she/her
  role: Postdoctoral Researcher
  long: |
    Hellina is a postdoctoral researcher at the AI Accountability Lab in Trinity College Dublin. Hellina holds a PhD and MSc from University of California at Berkeley in Computer Science. She received her BSc from Addis Ababa University in Electrical and computer engineering. Her research broadly lies in the intersection of Natural Language Processing, Human-Computer Interaction and AI Ethics with a focus on low-resourced languages and the Global South. 

    Her postdoc project focuses on co-designing for the Bamanankan language including setting up data infrastructure and policy framework as well as building language technologies such as speech recognition and machine translation by closely collaborating with community members. She has received multiple awards for her research including the Wikimedia Foundation Research of the Year Award, Wangarĩ Maathai Impact Award, best paper awards at EMNLP and Black in AI, and fellowships including the SIGHPC computational and data science fellowship and the FAccT DEI Scholars program. 
