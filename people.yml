- name: Nana Mgbechikwere Nwachukwu
  active: true
  image: /nananwachukwu.jpeg
  role: PhD Researcher
  bio: Nana Nwachukwu is a PhD Candidate at the AI Accountability Lab, Trinity College Dublin, under the supervision of Dr. Abeba Birhane. Her research focuses on AI ecosystem accountability, algorithmic governance, and justice-oriented frameworks for evaluating socio-technical systems,especially within Global South contexts. She is also an Affiliate at the Berkman Klein Center for Internet & Society at Harvard University.
  achievements: Nana holds advanced degrees in law, international humanitarian affairs, and digital communications, and has over a decade of experience working at the intersection of technology, human rights, and policy.
