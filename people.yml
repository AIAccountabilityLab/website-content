- name: Isabel Maria Ronan
  image: /people/HJP.jpg
  pronouns: she/her
  role: Postdoctoral Researcher
  long: |
    Isabel is a postdoctoral researcher at the AI Accountability Lab in Trinity College Dublin. She holds a PhD from University College Cork in computer science, along with an MSc degree in interactive media and a BMus degree. She received funding from Research Ireland under the ADVANCE CRT programme to undertake her PhD research, and is a three-time Quercus Scholar. 

    Her research investigates the understanding and assessment of AI measurements, with the aim of developing  more rigorous and consistent evaluation practices for deployed systems. Drawing on interdisciplinary insights from related domains such as measurement science, her work focuses on the application of established practices  to contemporary AI evaluations and the standardisation of methodological practices in the AI landscape. In particular, she examines the implications of practices such as LLM-as-a-judge and synthetic participants in AI evaluation for scientific validity, reliability and robustness. 
