- name: Riccardo Angius
  image: /people/riccardoangius.jpg
  pronouns: they/them
  role: PhD Researcher
  long: |
    Riccardo trained in Computer Science at the University of Cagliari, and in Artificial Intelligence at the University of Padova. Here they undertook research, before moving on to the University of Milano-Bicocca first, and working with NGOs AI Forensics and AlgorithmWatch after. In their PhD research, Riccardo investigates authoritarianism, technology-facilitated necropolitics, the capture of the public interest and the destruction of public value by Big AI companies, online platforms and search engines. 

    They bring over a decade of experience in interdisciplinary teams investigating social dynamics, overtrust in decision support systems, sociotechnical auditing of predictive and generative stochastic systems, deep neural networks, natural language processing, automated semantic analysis. Their work has been featured by international media such as The Washington Post and WIRED, published at conferences such as ACM CHI, ACM FAccT and AAAI ICWSM, cited by Pulitzer winners and world-renowned research institutes, supported formal proceedings of the European Commission, as well as expert testimony before the U.S. Congress.
