- name: Sananda Sahoo
  image: /people/HJP.jpg
  pronouns: she/her
  role: Postdoctoral Researcher
  long: |
    Sananda is a Postdoctoral Research Fellow at the AI Accountability Lab in Trinity College Dublin. She holds a PhD from the University of Western Ontario (Western University) in Media Studies. She received her Masters from the University of Missouri and MPhil from Calcutta University, India. She has received funding and fellowships from Mitacs Canada and Data Justice Lab, University of Cardiff. Her research sits at the intersection of critical data studies, automated distribution systems, algorithmic registers, and government accountability. 

    Her postdoc project primarily focuses on documenting, mapping, and evaluating uses of generative AI technologies in the Irish public services. Sahoo also looks at government accounting systems and public service delivery strategies as well as right-wing propaganda and populism disseminated through digital media systems.Her research has been published in edited volumes and journals such as BJHS Themes, Antipode, Television and New Media, and Critical Studies in Media Communication.
