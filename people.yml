- name: Abeba Birhane
  image: /people/abeba.jpg
  pronouns: she/her
  role: Assistant Professor of AI, Founder & Principal Investigator of AIAL
  long: |
    Abeba Birhane founded and leads the AI Accountability Lab (AIAL) at Trinity College Dublin, where she is an Assistant Professor of AI in the School of Computer Science and Statistics. Her research critically examines how AI systems encode and exacerbate societal inequities, historical norms, and power structures; and focuses on justice, fundamental rights, and inequalities across the AI pipeline. The throughline of her work emphasises holding those who are developing and deploying AI systems accountable for the systems they choose to build and societal consequences of their deployment. 

    Within the scientific community, Birhane’s work has received significant recognition including, the Lero Director’s Prize for her PhD Contribution, the 2022 ACM FAccT Distinguished Paper Award, and IEEE Conference on Secure and Trustworthy Machine Learning Distinguished Paper Award. Beyond academia, her work has also been widely recognised, including featuring in TIME’s 100 Most Influential People in AI (2023), the Irish Tatler Women of the Year Award in the Innovation category (2025), and the Inspiration Award at 2026 The Diversity Inclusion Tech Awards. Birhane actively contributes to global AI discussion, including dialogues with the Dalia Lama, participation in the Vatican’s AI working group, and the 2025 AI Action Summit in Paris. She has served on the United Nations Secretary-General’s AI Advisory Body and Ireland’s AI Advisory Council, and is currently appointed to the European Commission’s AI Act Advisory Forum. 
