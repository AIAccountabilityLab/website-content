- name: Riccardo Angius
  active: true
  image: /riccardoangius.jpg
  pronouns: they/them
  role: PhD Researcher
  bio: Riccardo is a mixed-method doctorand with a decade-long experience in interdisciplinary teams investigating social dynamics, overtrust in decision support systems, and sociotechnical auditing of predictive and generative stochastic systems.
  achievements: Their work in Sociolinguistics, Computer Supported Group Work and Science and Technology Studies at the Universities of Padova and Milano-Bicocca was published at impactful conferences such as ACM CHI and AAAI ICWSM. Riccardo's joint work with AI Forensics and Algorithm Watch has been featured by The Washington Post, Wired US, Die Zeit and Nieuwsuur, as well as cited by Pulitzer-winning Julia Angwin, the Reuters Institute and in formal proceedings of the European Commission.
