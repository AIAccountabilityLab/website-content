- name: Shane Gilligan
  active: true
  image: /shane-gilligan.png
  role: Intern
  bio: Shane Gilligan is currently a Master's student in Trinity College Dublin at the School of Computer Science and Statistics, where he also recently completed an undergraduate degree in computer science. He is undertaking research at the AI Accountability Lab under the supervision of Dr. Abeba Birhane. His work focuses on platform accountability, particularly audits of large platform recommender systems.
- name: Monique Munarini
  active: false
  image: /moniquemunarini.png
  role: Visiting Researcher
  bio: Monique Munarini (she/her) is a PhD candidate in AI for society at the University of Pisa- Italy. Qualified lawyer, researcher, and policy analyst, her PhD explores how equity can be a more inclusive approach to auditing AI systems than traditional fairness metrics by developing an equity-based framework rooted in feminist theory, participatory action research, and design justice principles, aiming to create AI audits that genuinely account for the needs and voices of all communities affected by AI. She also contributes to global policy debates through her work with the Center for AI and Digital Policy (CAIDP) and Digihumanism.
  achievements: She uses her legal and political science expertise to engage with and unify the work of computer scientists, social scientists, legal scholars, and real world practitioners to develop realistic and impactful outcomes in the AI ecosystem. Monique's paper on equitable AI audits gained meaningful recognition, and won the Best Research Paper Award at ACM ICEGOV 2024. She was recognized as a CAIDP Fellow 2024 for her work as policy analyst that shaped AI policy through careful research, thoughtful analysis, active engagement with policymakers, and a commitment to human rights, democracy, and the rule of law.
  links:
    - type: linkedin
      link: https://www.linkedin.com/in/moniquemunarini/
- name: Syrine Enneifer
  active: false
  image: /Syrine.jpg
  role: Visiting Researcher
  bio: Syrine Enneifer is a PhD candidate in Engineering in Computer Science at Sapienza University of Rome. Her research focuses on algorithmic auditing and the development of transparent frameworks designed to expose the inherent discrimination of existing data ecosystems.
  achievements: Her work interrogates the presence of ideological and gender-based distortions in automated systems, as well as the safety and ethical limitations of AI interactions involving vulnerable populations. By centering her research on data exposure and bias detection, she aims to establish more equitable standards for AI development and evaluation.
