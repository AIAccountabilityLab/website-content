- name: Harshvardhan Pandit
  active: true
  image: /HJP.jpg
  pronouns: he/him
  role: Research Fellow
  bio: Harsh works on understanding the implications of regulations on technology and how these solve or hinder real-world challenges associated with privacy, legal and regulatory compliance, and consent. His PhD (Computer Science, Trinity College Dublin) explored the application of linked data and semantic web technologies towards GDPR compliance, with a particular focus on consent and provenance.
  achievements: He currently co-chairs the W3C Data Privacy Vocabularies and Controls Community Group (DPVCG) – which develops interoperable vocabularies for privacy and data protection activities based on legal and practical requirements, is a member of the National Standards Authority of Ireland and contributes to ISO/IEC, CEN/CENELEC, and IEEE standardisation activities regarding privacy and AI, and is a nominated Technical Expert by the European Data Protection Board.
